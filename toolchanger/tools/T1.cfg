
# This is an example tool template. exact values of course need to be adjusted.
#───< Toolchanger specific! ---------------------------------------------

[gcode_macro T1]
variable_active: 0
variable_color: ""
variable_tool_number: 1
gcode:
   SELECT_TOOL T={tool_number} {rawparams}

[tool T1]
tool_number: 1
detection_pin: ^!et1:PA15
extruder: extruder1
fan: T1_partfan
# parking position
params_park_x: 88 
params_park_y: -103 
params_park_z: 255 

[probe_multiplexer T1]
pin: ^et1:PA15
probe_number: 1
z_offset: -1.15 # negative
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder1 TEMP=150

#==========================================================================
# anything below this point is likely custom to your own config.
#==========================================================================

[mcu et1]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3C003E000950415742363820-if00

#───< Extruder ---------------------------------------------------------
[tmc2209 extruder1]
uart_pin: et1:PC14
run_current: 0.45
stealthchop_threshold: 999999
sense_resistor: 0.110

[extruder1]
step_pin: et1: PB9
dir_pin: et1: PB8
enable_pin: !et1: PB7
microsteps: 32
full_steps_per_rotation: 200 
rotation_distance: 56.2
gear_ratio: 44:10, 37:17
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: et1: PA7
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: et1: PA6
pullup_resistor: 2200
control: pid
pid_Kp=30
pid_Ki=19.795
pid_Kd=20

min_temp: 0
max_temp: 300
max_extrude_cross_section: 0.64

#───< Fans ---------------------------------------------------------

[multi_pin T1_partfan_multi_pin]
pins: et1:PB13, et1:PA9

[fan_generic T1_partfan]
pin: multi_pin:T1_partfan_multi_pin

[heater_fan T1_hotend_fan]
pin: et1:PB15
heater: extruder1
heater_temp: 55

#───< accel --------------------------------------------------------
[adxl345 T1]
cs_pin: et1: PB12
spi_software_sclk_pin: et1: PB10
spi_software_mosi_pin: et1: PB11
spi_software_miso_pin: et1: PB2
axes_map: x,y,z

[tool T1]
params_accelerometer: 'adxl345 10'